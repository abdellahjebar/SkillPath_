spring.application.name=skillpath

# Le travail de nuit est lancé par le module Pipeline (ADR-009), jamais au démarrage de l'application.
spring.batch.job.enabled=false

# Journaux JSON sur la console, un objet par ligne (ADR-015). Le contexte de journalisation (MDC),
# dont l'identifiant de la requête, est ajouté à chaque objet par Spring Boot.
logging.structured.format.console=logstash

# Base de développement lancée par Docker Compose : seulement avec le profil « dev » (application-dev.properties).
spring.docker.compose.enabled=false

# Les migrations sont appliquées par MigrationsParModule (un schéma et un Flyway par module, ADR-029) :
# la configuration automatique de Flyway est désactivée.
spring.flyway.enabled=false
skillpath.migrations.emplacement=classpath:db/migration

# Session : cookie inaccessible au JavaScript, envoyé seulement par navigation sur le même site,
# expirée après 8 heures d'inactivité (décision du lot 11). Le cookie « Secure » est à activer au déploiement en HTTPS.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Aucun compte par défaut : sans cela, Spring Boot crée un utilisateur « user » dont le mot de passe est
# affiché dans les journaux. Les comptes viendront de la base (lot 11, étape 2) ; d'ici là, personne ne peut se connecter.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
