name: CI

on:
  pull_request:
  push:
    branches: [main]

# Jeton en lecture seule par défaut (ADR-017)
permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiène du dépôt
    runs-on: ubuntu-24.04
    steps:
      # Action épinglée sur un identifiant de commit (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Aucun secret versionné
        run: |
          fichiers=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$fichiers" ]; then
            echo "Fichier d'environnement versionné :"
            echo "$fichiers"
            exit 1
          fi

      - name: Aucune donnée d'offres versionnée
        run: |
          fichiers=$(git ls-files | grep -E '^(data|exports|offres)/|\.(ndjson|jsonl)$' || true)
          if [ -n "$fichiers" ]; then
            echo "Données d'offres versionnées (interdit, voir SECURITY.md) :"
            echo "$fichiers"
            exit 1
          fi

  backend:
    name: Backend (construction et tests)
    runs-on: ubuntu-24.04
    steps:
      # Action épinglée sur un identifiant de commit (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Action officielle de GitHub, épinglée sur un identifiant de commit (v6.3.0).
      # Java 25, comme dans le pom. Le cache accélère le téléchargement des dépendances Maven.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Maven tourne directement sur la machine : les tests d'intégration démarrent un
      # PostgreSQL 18 en conteneur (Testcontainers, ADR-016) et ont besoin de Docker.
      - name: Construire et tester (mvn verify)
        working-directory: backend
        run: mvn -B -ntp verify

  image:
    name: Image du serveur (construction)
    runs-on: ubuntu-24.04
    steps:
      # Action épinglée sur un identifiant de commit (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Docker est installé sur la machine : aucune action tierce. L'image est construite pour vérifier
      # que le Dockerfile marche, pas publiée (la publication viendra au premier déploiement, ADR-017).
      - name: Construire l'image du serveur
        run: docker build --tag skillpath-backend:ci backend

  # Les jobs frontend et conformité seront ajoutés avec le code correspondant.
  # Le contrôle du contrat d'API fait l'objet de #21.
