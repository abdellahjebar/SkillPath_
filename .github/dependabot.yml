version: 2
updates:
  # Actions GitHub : mises à jour hebdomadaires.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dépendances Maven du serveur : mises à jour hebdomadaires.
  # L'écosystème npm sera ajouté quand le dossier frontend existera.
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Images de base du Dockerfile du serveur : mises à jour hebdomadaires.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
